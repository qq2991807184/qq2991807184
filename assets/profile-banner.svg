<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Games, AI, and Open Source</title>
  <desc id="desc">A wide midnight navy banner coordinated with a gold and blue jeweled brand logo. The banner does not include the account name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset=".52" stop-color="#10172b"/><stop offset="1" stop-color="#07172a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c6926"/><stop offset=".5" stop-color="#ffe5a0"/><stop offset="1" stop-color="#b98031"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4e65ff"/><stop offset=".5" stop-color="#49d9ff"/><stop offset="1" stop-color="#3778ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#157cff" stop-opacity=".2"/><stop offset="1" stop-color="#157cff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d8c28e" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="930" cy="150" r="250" fill="url(#halo)"/>
