  <text x="106" y="119" fill="#d5bb7b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="5">A PERSONAL DISCOVERY HUB</text>
  <text x="102" y="190" fill="#f7f2e7" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="2">GAMES  ·  AI</text>
  <text x="106" y="236" fill="#b9c9e6" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="3">OPEN SOURCE &amp; WHAT'S NEXT</text>
